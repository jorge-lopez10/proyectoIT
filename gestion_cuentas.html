<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Cuentas</title>
    <link rel="stylesheet" href="gestion_cuentas.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestionar Cuentas</h1>
            
        </header>

        <section>
            <h2>Agregar Cuenta</h2>
            <form id="formAgregarCuenta">
                <label for="codigoCuenta">Código de cuenta:</label>
                <input type="text" id="codigoCuenta" required>

                <label for="saldoInicial">Saldo Inicial:</label>
                <input type="number" id="saldoInicial" required>

                <label for="cliente">ID Cliente:</label>
                <input type="text" id="cliente" required>

                <button type="submit">Agregar Cuenta</button>
            </form>
        </section>
        <button class="btn" onclick="window.location.href='principal.html'">Volver</button>
    <script src="gestion_cuentas.js"></script>
</body>
</html>
